# Configuration for CIFAR-100 experiments
# Best hyperparameters

model:
  backbone: resnet18
  num_classes: 100
  small_input: true

lwu:
  tau_r: 0.49
  tau_f: 0.35
  momentum_decay: 0.95
  adaptation_rate: 0.01
  surprise_threshold: 0.05
  stabilization_decay: 0.3

training:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 64
  num_epochs: 200
  patience: 10
  seed: 42

dataset:
  name: cifar100
  root: ./data
  num_tasks: 10
  val_split: 0.1

ewc:
  ewc_lambda: 25
  gamma: 1.0

si:
  si_c: 0.5
  xi: 1.0

lwf:
  temperature: 2.0
  alpha: 0.5

device: cuda
output_dir: ./results
experiment_name: cifar100_experiment
num_runs: 10
