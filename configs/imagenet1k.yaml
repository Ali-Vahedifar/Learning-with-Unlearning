# LwU on ImageNet-1K (ResNet-18)
# Generated from run manifest. Do not edit by hand.

model:
  backbone: resnet18
  num_classes: 1000
  small_input: false

lwu:
  tau_r: 0.54
  tau_f: 0.52
  momentum_decay: 0.95
  adaptation_rate: 0.005
  surprise_threshold: 0.05
  stabilization_decay: 0.1
  eta_c: 0.005
  n_c: 10
  delta_c: 0.5

training:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 128
  num_epochs: 100
  patience: 10
  seed: 42

dataset:
  name: imagenet1k
  root: ./data
  num_tasks: 10
  val_split: 0.1
  image_size: 224

device: cuda
output_dir: ./results
experiment_name: imagenet1k_lwu
num_runs: 10
